name: Upgrade Go version
on:
  workflow_dispatch:
    inputs:
      go-version:
        required: true
      go-toolchain-version:
        required: true
permissions:
  contents: read
jobs:
  upgrade-go-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      GO_VERSION: ${{ github.event.inputs.go-toolchain-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${GO_VERSION}
      - name: go get all
        run: |
          go mod edit -go ${{ github.event.inputs.go-version }}
          go mod edit -toolchain go${GO_VERSION}
          go get -u all
          go mod tidy
      - name: docker login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKER_HUB_OIDC_CONNECTION_ID }}
        with:
          registry-auth: |
            - registry: dhi.io
              username: ${{ vars.DOCKER_HUB_ORG }}
      - name: dockerfile
        run: |
          # Keep whatever suffix the Dockerfile already uses (e.g. -alpine3.24-dev, -dev, or none)
          SUFFIX=$(sed -n -E '1s#^FROM dhi\.io/golang:[0-9.]+(-[^@ ]+)?.*#\1#p' Dockerfile)
          TAG="${GO_VERSION}${SUFFIX}"
          DIGEST=$(docker buildx imagetools inspect "dhi.io/golang:${TAG}" --format '{{.Manifest.Digest}}')
          sed -i -E "1s#^(FROM dhi\.io/golang:)[^ ]+#\1${TAG}@${DIGEST}#" Dockerfile
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Upgrade Go version to ${GO_VERSION}
          title: Upgrade Go version to ${GO_VERSION}
          body: |
            Upgrade Go version to ${GO_VERSION}:
            https://go.dev/doc/devel/release
            - [ ] Set PR as "Ready for review"
            - [ ] Check CI
            - [ ] Submit PR review
          branch: upgrade-go
          delete-branch: true
          signoff: true
          draft: always-true # Because of: https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#triggering-further-workflow-runs.
