name: Upgrade Go version
on:
  workflow_dispatch:
    inputs:
      go-version:
        description: Language version for the go directive in go.mod (e.g. 1.27)
        required: true
      go-toolchain-version:
        description: Full Go toolchain release, without the "go" prefix (e.g. 1.27.4)
        required: true
permissions:
  contents: read
jobs:
  upgrade-go-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      GO_LANG_VERSION: ${{ github.event.inputs.go-version }}
      GO_VERSION: ${{ github.event.inputs.go-toolchain-version }}
      SANDBOX: upgrade-go
    steps:
      - name: validate inputs
        run: |
          echo "${GO_LANG_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "::error::invalid go-version: ${GO_LANG_VERSION}"; exit 1; }
          echo "${GO_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::invalid go-toolchain-version: ${GO_VERSION}"; exit 1; }
          echo "SBX_DEBUG_DIR=${RUNNER_TEMP}/sbx-debug" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/sbx-debug"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install sbx
        run: |
          # Local sandboxes are microVMs: give the runner user access to KVM.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx
          sbx version
      - name: sbx login
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "${DOCKER_HUB_TOKEN}" | sbx login --username "${DOCKER_HUB_USERNAME}" --password-stdin
      - name: docker login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKER_HUB_OIDC_CONNECTION_ID }}
        with:
          registry-auth: |
            - registry: dhi.io
              username: ${{ vars.DOCKER_HUB_ORG }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: create sandbox
        run: |
          # Deny all egress by default; the go-upgrade Kit declares the hosts the sandbox may reach.
          sbx policy init deny-all
          # The Kit (.github/kits/go-upgrade) is built on the host with buildx: it bakes the
          # checksum-verified Go toolchain into an overlay on the shell workload.
          sbx kit validate ./.github/kits/go-upgrade --kit-arg "goVersion=${GO_VERSION}"
          sbx create --no-input --name "${SANDBOX}" shell \
            --kit ./.github/kits/go-upgrade --kit-arg "goVersion=${GO_VERSION}" \
            "${GITHUB_WORKSPACE}" 2>&1 | tee "${SBX_DEBUG_DIR}/create.log"
      - name: go get all (in sandbox)
        run: |
          sbx exec --no-input -w "${GITHUB_WORKSPACE}" \
            -e "GO_LANG_VERSION=${GO_LANG_VERSION}" \
            -e "GO_VERSION=${GO_VERSION}" \
            -e NO_DOCKER=true \
            -e GOTOOLCHAIN=local \
            "${SANDBOX}" sh -euc '
              go version
              go mod edit -go "${GO_LANG_VERSION}"
              go mod edit -toolchain "go${GO_VERSION}"
              go get -u all
              go mod tidy
              go build ./...
              go vet ./...
              go test ./...
            ' 2>&1 | tee "${SBX_DEBUG_DIR}/go.log"
      - name: dockerfile (in sandbox)
        run: |
          sbx exec --no-input -w "${GITHUB_WORKSPACE}" \
            -e "GO_VERSION=${GO_VERSION}" \
            "${SANDBOX}" sh -euc '
              # Keep whatever suffix the Dockerfile already uses (e.g. -alpine3.24-dev, -dev, or none)
              SUFFIX=$(sed -n -E "1s#^FROM dhi\.io/golang:[0-9.]+(-[^@ ]+)?.*#\1#p" Dockerfile)
              TAG="${GO_VERSION}${SUFFIX}"
              DIGEST=$(docker buildx imagetools inspect "dhi.io/golang:${TAG}" --format "{{.Manifest.Digest}}")
              echo "${DIGEST}" | grep -Eq "^sha256:[0-9a-f]{64}$" || { echo "could not resolve digest for dhi.io/golang:${TAG}: ${DIGEST}"; exit 1; }
              sed -i -E "1s#^(FROM dhi\.io/golang:)[^ ]+#\1${TAG}@${DIGEST}#" Dockerfile
              head -1 Dockerfile
            ' 2>&1 | tee "${SBX_DEBUG_DIR}/dockerfile.log"
          git status --short
      - name: collect sbx diagnostics
        if: failure()
        run: |
          cd "${SBX_DEBUG_DIR}"
          # Allowed and blocked hosts (egress denials show up here with the matching rule).
          sbx policy log "${SANDBOX}" --limit 0 > policy-log.txt 2>&1 || true
          sbx policy log "${SANDBOX}" --limit 0 --json > policy-log.json 2>&1 || true
          sbx policy ls > policy-ls.txt 2>&1 || true
          sbx inspect "${SANDBOX}" --format json > inspect.json 2>&1 || true
          sbx ls > ls.txt 2>&1 || true
          sbx daemon status > daemon-status.txt 2>&1 || true
          sbx diagnose > diagnose.txt 2>&1 || true
          sbx kit inspect "${GITHUB_WORKSPACE}/.github/kits/go-upgrade" --kit-arg "goVersion=${GO_VERSION}" > kit-inspect.txt 2>&1 || true
          sbx diagnose --format json > diagnose.json 2>&1 || true
          ls -l /dev/kvm > kvm.txt 2>&1 || true
          git -C "${GITHUB_WORKSPACE}" status --short > git-status.txt 2>&1 || true
          git -C "${GITHUB_WORKSPACE}" diff > git-diff.txt 2>&1 || true
          {
            echo "## sbx diagnostics"
            echo '### Network policy log'
            echo '```'
            cat policy-log.txt
            echo '```'
            echo '### sbx diagnose'
            echo '```'
            cat diagnose.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          cat policy-log.txt diagnose.txt
          if grep -q 'BLOCKED REQUESTS' policy-log.txt; then
            echo "::error title=sbx egress denied::The sandbox tried to reach hosts that the network policy blocks. See the policy log in the job summary or the sbx-debug artifact."
          fi
      - name: upload sbx diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbx-debug
          path: ${{ env.SBX_DEBUG_DIR }}
          retention-days: 7
      - name: remove sandbox
        if: always()
        run: sbx rm --force "${SANDBOX}" || true
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Upgrade Go version to ${{ env.GO_VERSION }}
          title: Upgrade Go version to ${{ env.GO_VERSION }}
          body: |
            Upgrade Go version to ${{ env.GO_VERSION }}:
            https://go.dev/doc/devel/release
            - [ ] Set PR as "Ready for review"
            - [ ] Check CI
            - [ ] Submit PR review
          branch: upgrade-go
          delete-branch: true
          signoff: true
          draft: always-true # Because of: https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#triggering-further-workflow-runs.
